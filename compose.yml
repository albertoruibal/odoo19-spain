services:
  db:
    image: postgres:18
    user: root
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker

  odoo19:
    build:
      context: ./docker
    user: root
    depends_on:
      - db
    ports:
      - "10019:8069"
      - "20019:8072"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_ADMIN_PASSWD=${ADMIN_PASSWORD}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    volumes:
      - ./filestore:/var/lib/odoo
    restart: always
